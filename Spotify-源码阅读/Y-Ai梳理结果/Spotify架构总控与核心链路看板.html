<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify iOS 架构总控与核心链路详解看板</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #121214;
      --content: #161618;
      --card: #1b1b1f;
      --sidebar: #161618;
      --card-border: #2a2a30;
      --border: #2e2e36;
      --foreground: #f4f4f6;
      --muted-foreground: #a1a1aa;
      --placeholder: #71717a;
      --code-foreground: #86efac;
      --primary: #1ed760;
      --primary-foreground: #090d0a;
      --secondary: #27272d;
      --secondary-foreground: #e4e4e7;
      --accent: #1ed760;
      --link: #38bdf8;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .pulse-ring { animation: pulseBorder 1.4s ease-out; }
    @keyframes pulseBorder {
      0% { box-shadow: 0 0 0 0 var(--primary); }
      70% { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div class="max-w-[1600px] mx-auto p-3 md:p-5 space-y-4">

    <!-- 顶部总控横幅 -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-[var(--primary)] text-[var(--primary-foreground)]">Objective-C + UIKit + Runtime</span>
            <h1 class="text-base md:text-lg font-bold tracking-tight">Spotify iOS 仿写项目 · 架构总控与核心实现按需拆解台</h1>
          </div>
          <p class="text-xs text-[var(--muted-foreground)]">
            左栏为<strong>「全局架构总控 & 层级/协议按需下钻」</strong>（看整体、查协议供需、按层进子模块）；右栏为<strong>「路径内重点实现逻辑详解」</strong>（按调用链路拆解 6 大特殊场景与 OC/Runtime 技巧，支持左右双向定位跳转）。
          </p>
        </div>
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input id="globalSearch" type="text" placeholder="搜索类名 / @protocol / 方法名 / 场景关键词..."
                 class="w-full md:w-72 px-3 py-1.5 text-xs rounded-lg bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] placeholder-[var(--placeholder)] focus:outline-none focus:border-[var(--primary)]" />
          <button id="clearSearchBtn" class="hidden px-2.5 py-1.5 text-xs rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90">重置</button>
        </div>
      </div>

      <!-- 顶部高频困惑一键直达条 -->
      <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-[var(--card-border)] text-xs">
        <span class="text-[var(--muted-foreground)] font-medium mr-1">痛点直达：</span>
        <button onclick="quickJump('P0', 'protocols')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">🔌 7大协议给谁用/谁实现</button>
        <button onclick="quickJump('L4', 'network')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">🌐 网络申请与并发防惊群</button>
        <button onclick="quickJump('L5', 'lru3')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">🗂️ 三级 LRU 缓存 (L1/L2/L3)</button>
        <button onclick="quickJump('L3', 'audiocache')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">⚡ 歌曲缓存与上下首0ms预加载</button>
        <button onclick="quickJump('L3', 'background')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">🔒 后台播放/锁屏/灵动岛</button>
        <button onclick="quickJump('L2', 'infinite')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">♾️ 首页无限刷新与保序分页</button>
        <button onclick="quickJump('L1', 'uiarch')" class="px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition">🎨 界面架构与三槽位丝滑转场</button>
      </div>
    </header>

    <!-- 双区块主工作台 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

      <!-- 区块一：左侧总控与层级下钻 (5 cols) -->
      <section class="lg:col-span-5 bg-[var(--card)] border border-[var(--border)] rounded-xl overflow-hidden flex flex-col">
        <div class="p-3.5 border-b border-[var(--card-border)] flex items-center justify-between">
          <div>
            <div class="text-xs font-bold uppercase tracking-wider text-[var(--primary)]">区块一 · 架构总控与层级下钻</div>
            <div class="text-xs text-[var(--muted-foreground)] mt-0.5">点击任意层级或协议进入子架构，点击卡片按需展开方法与依赖</div>
          </div>
          <span id="leftCountBadge" class="px-2 py-0.5 text-xs font-mono rounded bg-[var(--background)] border border-[var(--border)]">7 个视图</span>
        </div>

        <!-- 层级导航胶囊 -->
        <div id="layerTabs" class="p-2.5 bg-[var(--background)] border-b border-[var(--card-border)] flex flex-wrap gap-1.5"></div>

        <!-- 层级内部详情容器 -->
        <div id="leftPaneContent" class="p-3.5 space-y-3 max-h-[780px] overflow-y-auto custom-scroll"></div>
      </section>

      <!-- 区块二：右侧路径内重点实现逻辑详解 (7 cols) -->
      <section class="lg:col-span-7 bg-[var(--card)] border border-[var(--border)] rounded-xl overflow-hidden flex flex-col">
        <div class="p-3.5 border-b border-[var(--card-border)] flex items-center justify-between">
          <div>
            <div class="text-xs font-bold uppercase tracking-wider text-[var(--primary)]">区块二 · 路径内重点实现逻辑详解</div>
            <div class="text-xs text-[var(--muted-foreground)] mt-0.5">点击上方场景或调用路径节点，逐层拆解核心方法、设计巧思与源码行号</div>
          </div>
          <span id="rightStepIndicator" class="px-2 py-0.5 text-xs font-mono rounded bg-[var(--background)] border border-[var(--border)]">按需跳转</span>
        </div>

        <!-- 专题切换条 -->
        <div id="scenarioTabs" class="p-2.5 bg-[var(--background)] border-b border-[var(--card-border)] flex flex-wrap gap-1.5"></div>

        <!-- 调用路径步骤条 + 深度解析区 -->
        <div id="rightPaneContent" class="p-4 space-y-4 max-h-[780px] overflow-y-auto custom-scroll"></div>
      </section>

    </div>
  </div>

  <script>
    // ==================== 数据模型：区块一（层级架构与协议矩阵） ====================
    const ARCH_LAYERS = [
      {
        id: 'L0',
        badge: 'L0 总控',
        title: '全局五层架构总控图',
        subtitle: '三大架构支柱：Facade 门面 + @protocol 策略插座 + NSHashTable 弱引用多播观察者',
        summary: '整个项目遵循严格的单向依赖与协议隔离：UI 模块（Modules）绝不直接碰 AVPlayer 或 NSURLSession，一切播放指令走 SPPlayerService 门面，一切数据请求走 SPMusicRepository 门面。',
        diagram: [
          { layerId: 'L1', tag: '第 1 层 · App 容器层', name: 'AppDelegate / SceneDelegate / SPRootViewController / SPNavigationController', desc: '启动依赖注入、引导/登录门禁路由、三明治根容器（隐藏原生TabBar + 悬浮MiniPlayer + 零抖动抽屉）', jumpScenario: 'uiarch' },
          { layerId: 'L2', tag: '第 2 层 · Modules 业务界面层', name: 'Home / Search / Library / Detail / MiniPlayer / NowPlaying / Transition / Drawer / Settings', desc: '只消费 SPMediaItem 协议渲染卡片与行，只调 SPPlayerService 与 SPMusicRepository，通过 SPPlayerObserver 响应状态', jumpScenario: 'infinite' },
          { layerId: 'L3', tag: '第 3 层 · Player 播放服务与内核层', name: 'SPPlayerService (门面) → SPPlayQueue + SPAudioCacheManager (L1/L2) + SPAVPlayerEngine + SPSystemMediaController', desc: '管理播放队列、洗牌算法、L1/L2音频缓存与上下首预加载、AVPlayer KVO 封装、锁屏/灵动岛与后台切歌保活', jumpScenario: 'audiocache' },
          { layerId: 'L4', tag: '第 4 层 · Data 数据仓库与多源层', name: 'SPMusicRepository (门面 + L3缓存) → SPMusicDataSource <SPNeteaseMusicSource | SPMockMusicSource> + SPLibraryStore', desc: '支持网易云真实 API 与本地 Mock 热切换、L3 元数据 LRU 缓存、匿名/用户 Cookie 会话管理、自建歌单持久化', jumpScenario: 'network' },
          { layerId: 'L5', tag: '第 5 层 · Core 基础底座与 Models 领域层', name: 'SPLRUCache / SPHTTPClient / SPAuthService / SPTheme / Runtime 分类 / SPMediaItem 领域模型', desc: 'os_unfair_lock 双向链表 LRU、NSURLSession 封装、Keychain+SHA256 认证、封面降采样与16x16色相桶取色', jumpScenario: 'lru3' }
        ],
        nodes: [
          {
            id: 'Pillar-Facade',
            name: '架构支柱 ①：双门面模式 (Dual Facade)',
            file: 'Spotify/Player/SPPlayerService.h & Spotify/Data/Repository/SPMusicRepository.h',
            role: '收拢所有外部复杂性，向 UI 层只暴露两个单例入口',
            provides: 'UI 控制器只调用 [SPPlayerService shared] 控制播放、调用 [SPMusicRepository shared] 获取数据',
            methods: [
              'SPPlayerService: -playTracks:startIndex:contextTitle:, -togglePlayPause, -next, -previous, -seekToTime:',
              'SPMusicRepository: -fetchHomeSectionsForCategory:completion:, -searchWithKeyword:completion:, -fetchPlayURLForTrack:completion:'
            ],
            jump: { scenario: 'protocols', step: 0 }
          },
          {
            id: 'Pillar-Protocol',
            name: '架构支柱 ②：协议插座解耦 (@protocol Socket)',
            file: 'SPMusicDataSource.h / SPAudioEngine.h / SPAuthProvider.h / SPMediaItem.h',
            role: '把易变的「数据源」「音频解码器」「登录渠道」「媒体模型」全部抽象成协议',
            provides: 'AppDelegate 启动或 Settings 页点击切换时，直接替换 repo.source 或 auth.provider，UI 零改动热切换',
            methods: [
              '[SPMusicRepository shared].source = [SPNeteaseMusicSource new] 或 [SPMockMusicSource new]',
              '[SPAuthService shared].provider = [SPLocalAuthProvider new] 或 [SPNeteaseAuthProvider new]'
            ],
            jump: { scenario: 'protocols', step: 1 }
          },
          {
            id: 'Pillar-Multicast',
            name: '架构支柱 ③：弱引用多播观察者 (NSHashTable Multicast)',
            file: 'Spotify/Player/SPPlayerService.m:L18-L80',
            role: '解决传统 delegate 只能一对一、NSNotification 缺乏类型约束的痛点',
            provides: '用 [NSHashTable weakObjectsHashTable] 存储观察者，VC 销毁自动移除无需手动解绑，切歌时同时通知 RootVC、MiniPlayer、NowPlaying、Detail 等 8 个组件',
            methods: [
              '-addObserver:(id<SPPlayerObserver>)observer',
              '-notify:(SEL)selector (遍历 observers.allObjects 动态派发)'
            ],
            jump: { scenario: 'protocols', step: 3 }
          }
        ]
      },
      {
        id: 'P0',
        badge: '🔌 7大协议',
        title: '七大 @protocol 接口供需全景矩阵',
        subtitle: '彻底厘清：每个协议谁定义、提供给谁调、哪些类的哪些方法实现了它',
        summary: '全项目共有 7 个核心自定义协议，分为三类：① 策略插座协议（SPMusicDataSource / SPAudioEngine / SPAuthProvider）；② 多态模型协议（SPMediaItem）；③ 状态回调协议（SPPlayerObserver / SPAudioEngineDelegate / SPAuthObserver）。',
        nodes: [
          {
            id: 'Proto-SPMusicDataSource',
            name: '@protocol SPMusicDataSource',
            file: 'Spotify/Data/SPMusicDataSource.h:L29-L72',
            role: '【数据层插座】定义 12 个音乐数据异步读取接口',
            implementers: '① SPNeteaseMusicSource（真实网易云 API 实现）\n② SPMockMusicSource（本地 mock_data.json 实现）\n③ SPMusicRepository（门面装饰器实现：加 L3 缓存 + 主线程派发）',
            consumers: '所有业务 VC（SPHomeVC / SPSearchVC / SPLibraryVC / SPDetailVC / SPNowPlayingVC）以及 SPAudioCacheManager（查播放 URL），统一通过 [SPMusicRepository shared] 调用',
            methods: [
              '-fetchHomeSectionsForCategory:completion: (首页分类分区)',
              '-fetchHomeMoreSectionsForCategory:page:completion: (首页无限上滑分页)',
              '-fetchSearchCategoriesWithCompletion: & -searchWithKeyword:completion: (搜索)',
              '-fetchPlaylistWithId:completion: / -fetchAlbumWithId:completion: / -fetchArtistTopTracksWithId:completion: (详情)',
              '-fetchPlayURLForTrack:completion: (播放前实时换取音频流 URL)',
              '-fetchLyricsForTrack:completion: (获取双语 LRC 歌词文档)'
            ],
            jump: { scenario: 'protocols', step: 1 }
          },
          {
            id: 'Proto-SPMediaItem',
            name: '@protocol SPMediaItem',
            file: 'Spotify/Models/SPMediaItem.h:L20-L31',
            role: '【多态渲染协议】抹平歌曲、专辑、歌单、艺人 4 种模型在 UI 卡片与列表行中的差异',
            implementers: '① SPTrack (SPTrack.m:L33-L45)\n② SPAlbum (SPAlbum.m:L27-L44)\n③ SPPlaylist (SPPlaylist.m:L24-L45)\n④ SPArtist (SPArtist.m:L12-L21)',
            consumers: 'SPMediaCardCell、SPHomeShortcutCell、SPMediaRowView、UIImageView(SPCover)、SPDetailViewController、SPDetailHeaderView',
            methods: [
              '-(SPMediaType)mediaType (返回 Track / Album / Playlist / Artist，决定封面是圆是方、点击是播歌还是进详情)',
              '-(NSString *)identifier / -(NSString *)title / -(NSString *)subtitle',
              '-(nullable NSString *)coverURL / -(nullable UIColor *)themeColor'
            ],
            jump: { scenario: 'protocols', step: 2 }
          },
          {
            id: 'Proto-SPPlayerObserver',
            name: '@protocol SPPlayerObserver',
            file: 'Spotify/Player/SPPlayerService.h:L32-L39',
            role: '【多播状态订阅协议】把播放器的曲目、状态、进度、队列、模式变化广播给全 App UI',
            implementers: '共 8 个类实现：\n① SPRootViewController (L435: 监听切歌显隐 MiniPlayer)\n② SPMiniPlayerView (L441-L460: 监听全部 5 个方法刷新槽位与进度条)\n③ SPNowPlayingViewController (L953-L968: 监听全部 5 个方法刷新大播放页与歌词)\n④ SPDetailViewController (L453-L465: 刷新列表行绿色高亮与跳动音律条)\n⑤ SPHomeViewController (L485: 监听切歌提取封面主色刷新首页顶部氛围光)\n⑥ SPSearchViewController (L509) / ⑦ SPHistoryViewController (L197) / ⑧ SPQueueViewController (L124)',
            consumers: '仅由 SPPlayerService 内部通过 -notify:(SEL)selector 调用派发',
            methods: [
              '@optional -playerDidChangeTrack:(SPPlayerService *)player',
              '@optional -playerDidChangeState:(SPPlayerService *)player',
              '@optional -playerDidUpdateProgress:(SPPlayerService *)player',
              '@optional -playerDidChangeQueue:(SPPlayerService *)player',
              '@optional -playerDidChangeMode:(SPPlayerService *)player'
            ],
            jump: { scenario: 'protocols', step: 3 }
          },
          {
            id: 'Proto-SPAudioEngine',
            name: '@protocol SPAudioEngine & @protocol SPAudioEngineDelegate',
            file: 'Spotify/Player/Engine/SPAudioEngine.h:L16-L41',
            role: '【音频内核隔离协议】将底层 AVPlayer 与上层播放队列/缓存/系统控制彻底解耦',
            implementers: 'SPAudioEngine 由 SPAVPlayerEngine 实现 (SPAVPlayerEngine.m:L60-L158)；\nSPAudioEngineDelegate 由 SPPlayerService 实现 (SPPlayerService.m:L347-L383)',
            consumers: 'SPPlayerService 持有 id<SPAudioEngine> engine 并下发指令；SPAVPlayerEngine 通过 weak delegate 向上汇报状态与进度',
            methods: [
              'SPAudioEngine: -loadURL:autoPlay:, -loadAsset:autoPlay:, -play, -pause, -stop, -seekToTime:completion:',
              'SPAudioEngineDelegate: -audioEngine:didChangeState:, -audioEngine:didUpdateCurrentTime:duration:bufferedTime:, -audioEngineDidFinishPlaying:, -audioEngine:didFailWithError:'
            ],
            jump: { scenario: 'protocols', step: 4 }
          },
          {
            id: 'Proto-SPAuthProvider',
            name: '@protocol SPAuthProvider & @protocol SPAuthObserver',
            file: 'Spotify/Core/Auth/SPAuthProvider.h:L19-L45 & SPAuthService.h:L16-L20',
            role: '【认证策略与登录态广播协议】隔离本地 Keychain 认证与网易云远端认证',
            implementers: 'SPAuthProvider 由 SPLocalAuthProvider 和 SPNeteaseAuthProvider 实现；\nSPAuthObserver 由 SPUserAvatarButton、SPSideDrawerViewController、SPLibraryViewController、SPSettingsViewController 实现',
            consumers: 'SPAuthService 持有 id<SPAuthProvider> provider 并向 SPAuthObserver 广播 -authServiceDidChangeUser:',
            methods: [
              'SPAuthProvider: -sendVerificationCodeToAccount:purpose:completion:, -registerWithAccount:..., -loginWithAccount:password:completion:, -loginWithAccount:verificationCode:completion:',
              'SPAuthObserver: -authServiceDidChangeUser:(SPAuthService *)authService'
            ],
            jump: { scenario: 'protocols', step: 5 }
          }
        ]
      },
      {
        id: 'L1',
        badge: 'L1 容器层',
        title: 'App 入口与根容器层 (Spotify/App/)',
        subtitle: '负责依赖注入、引导门禁路由、三明治根容器与无导航栏侧滑手势恢复',
        summary: '这一层只有 4 个类，但决定了整个 App 的骨架：AppDelegate 注入默认数据源与认证源；SceneDelegate 决定启动进引导页、登录页还是主界面；SPRootViewController 组装三层容器；SPNavigationController 恢复全屏返回手势。',
        nodes: [
          {
            id: 'Class-AppDelegate',
            name: 'AppDelegate',
            file: 'Spotify/App/AppDelegate.m:L17-L45',
            role: '应用启动配置与策略注入点',
            provides: '读取 NSUserDefaults 决定向 SPMusicRepository.shared.source 注入 SPNeteaseMusicSource 还是 SPMockMusicSource，向 SPAuthService.shared.provider 注入 SPLocalAuthProvider 还是 SPNeteaseAuthProvider，并设置 SDImageCache 内存上限 80MB',
            methods: ['-application:didFinishLaunchingWithOptions: (L19-L37)'],
            jump: { scenario: 'protocols', step: 1 }
          },
          {
            id: 'Class-SceneDelegate',
            name: 'SceneDelegate',
            file: 'Spotify/App/SceneDelegate.m:L17-L109',
            role: '窗口根控制器状态机与交叉溶解转场中心',
            provides: '根据 hasCompletedOnboarding / SPAuthService.isLoggedIn / hasEnteredGuestMode 决定首屏是 SPOnboardingViewController、SPAuthWelcomeViewController 还是 SPRootViewController',
            methods: [
              '-scene:willConnectToSession:options: (L45-L75)',
              '-transitionToMainAppAnimated: / -transitionToAuthWelcomeAnimated: (L79-L107)'
            ],
            jump: { scenario: 'uiarch', step: 0 }
          },
          {
            id: 'Class-SPRootViewController',
            name: 'SPRootViewController',
            file: 'Spotify/App/SPRootViewController.m:L149-L629',
            role: '全局总控根容器（Stationary Main + Bottom Dock + Overlay Drawer）',
            provides: '管理 SPInternalTabBarController（隐藏系统原生 TabBar）、自定义底栏 customTabBar、悬浮 SPMiniPlayerView、左侧抽屉 SPSideDrawerViewController，以及点击 MiniPlayer 弹出 SPNowPlayingViewController 的自定义转场',
            methods: [
              '-setupTabs / -setupBottomDock / -setupOverlayDrawer (L192-L370)',
              '-updateTabDockMetrics (L305-L313: 动态注入 additionalSafeAreaInsets.bottom)',
              '-handleDrawerPan: & -applyDrawerProgress: (L469-L502: 底层静止零抖动抽屉)',
              '-handleDrawerAction: (L562-L591: 先无动画 push 再关抽屉的单段丝滑转场)',
              '-presentNowPlaying (L602-L615: 绑定 SPNowPlayingTransition)'
            ],
            jump: { scenario: 'uiarch', step: 1 }
          },
          {
            id: 'Class-SPNavigationController',
            name: 'SPNavigationController',
            file: 'Spotify/App/SPNavigationController.m:L11-L30',
            role: '隐藏系统导航栏并修复侧滑返回手势的导航容器',
            provides: '全局设置 navigationBarHidden = YES，接管 interactivePopGestureRecognizer.delegate，在 viewControllers.count > 1 时恢复系统右滑返回',
            methods: [
              '-viewDidLoad (L13-L19)',
              '-gestureRecognizerShouldBegin: (L21-L26)'
            ],
            jump: { scenario: 'uiarch', step: 2 }
          }
        ]
      },
      {

        : `${layer.nodes.length} 个核心模块`;

      let html = '';

      if (q.length === 0) {
        html += `
          <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1.5">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold text-[var(--foreground)]">${escapeHTML(layer.title)}</h2>
              <span class="text-xs font-mono text-[var(--primary)]">${escapeHTML(layer.badge)}</span>
            </div>
            <div class="text-xs font-medium text-[var(--muted-foreground)]">${escapeHTML(layer.subtitle)}</div>
            <p class="text-xs text-[var(--foreground)] opacity-90 leading-relaxed pt-1 border-t border-[var(--card-border)]">${escapeHTML(layer.summary)}</p>
          </div>
        `;

        // 如果是 L0 总控层，渲染交互式五层架构栈拓扑图
        if (layer.diagram) {
          html += `
            <div class="space-y-2">
              <div class="text-xs font-semibold text-[var(--muted-foreground)] flex items-center justify-between">
                <span>▼ 点击下方任意架构层级即可按层进入查看局部架构：</span>
              </div>
              <div class="space-y-1.5">
                ${layer.diagram.map((d, idx) => `
                  <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] hover:border-[var(--primary)] transition cursor-pointer group"
                       onclick="selectLayer('${d.layerId}')">
                    <div class="flex items-center justify-between gap-2">
                      <span class="px-2 py-0.5 text-xs font-bold rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] group-hover:bg-[var(--primary)] group-hover:text-[var(--primary-foreground)] transition">${escapeHTML(d.tag)}</span>
                      <div class="flex items-center gap-1.5">
                        <button onclick="event.stopPropagation(); selectScenario('${d.jumpScenario}', 0)"
                                class="px-2 py-0.5 text-xs rounded bg-[var(--card)] border border-[var(--border)] text-[var(--link)] hover:underline">
                          右侧重点逻辑 →
                        </button>
                        <span class="text-xs text-[var(--primary)] font-semibold">进入该层 ▸</span>
                      </div>
                    </div>
                    <div class="text-xs font-mono font-semibold mt-1.5 text-[var(--foreground)]">${escapeHTML(d.name)}</div>
                    <div class="text-xs text-[var(--muted-foreground)] mt-0.5">${escapeHTML(d.desc)}</div>
                  </div>
                  ${idx < layer.diagram.length - 1 ? `<div class="text-center text-xs text-[var(--muted-foreground)] leading-none">↓ 单向依赖 / 协议回调 ↑</div>` : ''}
                `).join('')}
              </div>
            </div>
          `;
        }
      }

      // 渲染当前层级的类/协议卡片（支持折叠/展开与跳转到右栏）
      html += `<div class="space-y-2.5">`;
      if (nodesToShow.length === 0) {
        html += `<div class="p-6 text-center text-xs text-[var(--muted-foreground)]">未找到匹配「${escapeHTML(searchQuery)}」的类或协议</div>`;
      } else {
        nodesToShow.forEach(node => {
          const isExpanded = q.length > 0 || expandedNodes.has(node.id) || highlightedNodeId === node.id;
          const isHighlighted = highlightedNodeId === node.id;
          const borderCls = isHighlighted ? 'border-[var(--primary)] pulse-ring' : 'border-[var(--border)]';

          html += `
            <div id="node-${node.id}" class="rounded-lg bg-[var(--background)] border ${borderCls} overflow-hidden transition">
              <div onclick="toggleNode('${node.id}')" class="p-3 cursor-pointer hover:opacity-95 flex items-start justify-between gap-2">
                <div class="space-y-1">
                  <div class="flex flex-wrap items-center gap-1.5">
                    ${node._layerBadge ? `<span class="px-1.5 py-0.5 text-xs rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">${escapeHTML(node._layerBadge)}</span>` : ''}
                    <span class="text-xs md:text-sm font-mono font-bold text-[var(--foreground)]">${escapeHTML(node.name)}</span>
                  </div>
                  <div class="text-xs text-[var(--muted-foreground)]">${escapeHTML(node.role)}</div>
                </div>
                <span class="text-xs font-mono text-[var(--primary)] shrink-0">${isExpanded ? '收起 ▾' : '展开 ▸'}</span>
              </div>

              ${isExpanded ? `
                <div class="px-3 pb-3 pt-2 border-t border-[var(--card-border)] space-y-2 text-xs">
                  <div class="font-mono text-[var(--muted-foreground)] bg-[var(--card)] px-2 py-1 rounded border border-[var(--border)] break-all">
                    📄 ${escapeHTML(node.file)}
                  </div>

                  ${node.provides ? `
                    <div class="space-y-0.5">
                      <div class="font-semibold text-[var(--foreground)]">职责与对外能力：</div>
                      <div class="text-[var(--muted-foreground)] leading-relaxed">${escapeHTML(node.provides)}</div>
                    </div>
                  ` : ''}

                  ${node.implementers ? `
                    <div class="space-y-0.5">
                      <div class="font-semibold text-[var(--success)]">✅ 哪些类实现了该协议 (Implementers)：</div>
                      <div class="text-[var(--foreground)] whitespace-pre-line leading-relaxed bg-[var(--card)] p-2 rounded border border-[var(--border)]">${escapeHTML(node.implementers)}</div>
                    </div>
                  ` : ''}

                  ${node.consumers ? `
                    <div class="space-y-0.5">
                      <div class="font-semibold text-[var(--link)]">🎯 接口提供给谁调用 (Consumers)：</div>
                      <div class="text-[var(--foreground)] leading-relaxed bg-[var(--card)] p-2 rounded border border-[var(--border)]">${escapeHTML(node.consumers)}</div>
                    </div>
                  ` : ''}

                  ${node.methods && node.methods.length ? `
                    <div class="space-y-1">
                      <div class="font-semibold text-[var(--foreground)]">🔧 核心方法实现清单：</div>
                      <ul class="space-y-1 font-mono bg-[var(--card)] p-2 rounded border border-[var(--border)]">
                        ${node.methods.map(m => `<li class="text-xs text-[var(--code-foreground)] break-all">• ${escapeHTML(m)}</li>`).join('')}
                      </ul>
                    </div>
                  ` : ''}

                  ${node.jump ? `
                    <div class="pt-1 flex justify-end">
                      <button onclick="selectScenario('${node.jump.scenario}', ${node.jump.step})"
                              class="px-3 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold text-xs hover:opacity-90 transition">
                        在右侧查看该模块重点实现逻辑 →
                      </button>
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          `;
        });
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    // 渲染区块二：专题切换胶囊
    function renderScenarioTabs() {
      const container = document.getElementById('scenarioTabs');
      container.innerHTML = SCENARIOS.map(sc => {
        const active = sc.id === currentScenarioId;
        const cls = active
          ? 'bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold shadow-sm'
          : 'bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] hover:text-[var(--foreground)]';
        return `<button onclick="selectScenario('${sc.id}', 0)" class="px-2.5 py-1 text-xs rounded-lg transition ${cls}">${escapeHTML(sc.badge)}</button>`;
      }).join('');
    }

    // 渲染区块二：调用路径步骤条与深度逻辑详解
    function renderRightPane() {
      const scenario = SCENARIOS.find(s => s.id === currentScenarioId) || SCENARIOS[0];
      if (currentStepIndex >= scenario.steps.length) currentStepIndex = 0;
      const step = scenario.steps[currentStepIndex];

      document.getElementById('rightStepIndicator').textContent =
        `步骤 ${currentStepIndex + 1} / ${scenario.steps.length}`;

      const container = document.getElementById('rightPaneContent');
      container.innerHTML = `
        <!-- 专题导语 -->
        <div class="p-3.5 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-sm md:text-base font-bold text-[var(--foreground)]">${escapeHTML(scenario.title)}</h2>
            <span class="px-2 py-0.5 text-xs font-semibold rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] shrink-0">${escapeHTML(scenario.badge)}</span>
          </div>
          <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${escapeHTML(scenario.overview)}</p>
        </div>

        <!-- 交互式调用链路步骤条 (Call Path Stepper) -->
        <div class="space-y-1.5">
          <div class="text-xs font-semibold text-[var(--muted-foreground)]">
            🧭 路径节点导航（点击下方链路中的任意环节切换详细实现逻辑）：
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-1.5">
            ${scenario.steps.map((st, idx) => {
              const active = idx === currentStepIndex;
              const cls = active
                ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] font-semibold'
                : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)] hover:border-[var(--primary)]';
              return `
                <button onclick="selectStep(${idx})"
                        class="p-2 rounded-lg border text-left transition flex flex-col justify-between ${cls}">
                  <div class="text-xs leading-snug">${idx + 1}. ${escapeHTML(st.stepTitle)}</div>
                  <div class="text-xs font-mono opacity-80 truncate mt-1">${escapeHTML(st.className)}</div>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 当前选中路径节点的深度实现卡片 -->
        <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--primary)] space-y-3.5">
          <div class="flex flex-wrap items-start justify-between gap-2 pb-2.5 border-b border-[var(--card-border)]">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-xs font-bold rounded bg-[var(--primary)] text-[var(--primary-foreground)]">环节 ${currentStepIndex + 1}</span>
                <h3 class="text-sm md:text-base font-bold text-[var(--foreground)]">${escapeHTML(step.stepTitle)}</h3>
              </div>
              <div class="text-xs font-mono text-[var(--link)] break-all">
                类：<strong>${escapeHTML(step.className)}</strong> · 方法：<strong>${escapeHTML(step.methodName)}</strong>
              </div>
              <div class="text-xs font-mono text-[var(--muted-foreground)]">
                📍 源码路径：${escapeHTML(step.file)}
              </div>
            </div>
            <button onclick="locateInLeftPane('${step.leftLayer}', '${step.leftNode}')"
                    class="px-2.5 py-1.5 rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)] text-xs font-semibold hover:opacity-90 transition shrink-0">
              ← 在左栏架构中定位此类
            </button>
          </div>

          <!-- 工程痛点 -->
          <div class="p-3 rounded-lg bg-[var(--card)] border border-[var(--border)] space-y-1">
            <div class="text-xs font-bold text-[var(--warning)]">💡 为什么要这样写？（工程痛点与场景挑战）</div>
            <p class="text-xs text-[var(--foreground)] leading-relaxed">${escapeHTML(step.painPoint)}</p>
          </div>

          <!-- 核心实现逻辑分步拆解 -->
          <div class="space-y-2">
            <div class="text-xs font-bold text-[var(--success)]">⚙️ 核心实现逻辑逐层拆解：</div>
            <div class="space-y-2">
              ${step.logic.map((item, i) => `
                <div class="p-2.5 rounded-lg bg-[var(--card)] border border-[var(--border)] flex items-start gap-2.5 text-xs leading-relaxed">
                  <span class="px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-mono font-bold shrink-0">${i + 1}</span>
                  <span class="text-[var(--foreground)]">${escapeHTML(item)}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- 关键源码对照 -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-[var(--foreground)]">📝 项目真实关键源码摘录：</span>
              <span class="font-mono text-[var(--muted-foreground)]">${escapeHTML(step.file)}</span>
            </div>
            <pre class="p-3 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-mono text-[var(--code-foreground)] overflow-x-auto leading-relaxed custom-scroll"><code>${escapeHTML(step.code)}</code></pre>
          </div>

          <!-- 上一步 / 下一步导航 -->
          <div class="pt-2 border-t border-[var(--card-border)] flex items-center justify-between">
            <button onclick="selectStep(${Math.max(0, currentStepIndex - 1)})"
                    ${currentStepIndex === 0 ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--card)] border border-[var(--border)] disabled:opacity-40 hover:border-[var(--primary)] transition">
              ← 上一环节
            </button>
            <span class="text-xs text-[var(--muted-foreground)]">当前路径共 ${scenario.steps.length} 个核心环节</span>
            <button onclick="selectStep(${Math.min(scenario.steps.length - 1, currentStepIndex + 1)})"
                    ${currentStepIndex === scenario.steps.length - 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--primary)] text-[var(--primary-foreground)] disabled:opacity-40 hover:opacity-90 transition">
              下一环节 →
            </button>
          </div>
        </div>
      `;
    }

    // ==================== 交互控制函数 ====================
    function selectLayer(layerId) {
      currentLayerId = layerId;
      highlightedNodeId = null;
      renderLayerTabs();
      renderLeftPane();
    }

    function toggleNode(nodeId) {
      if (expandedNodes.has(nodeId)) {
        expandedNodes.delete(nodeId);
      } else {
        expandedNodes.add(nodeId);
      }
      highlightedNodeId = null;
      renderLeftPane();
    }

    function selectScenario(scenarioId, stepIdx = 0) {
      currentScenarioId = scenarioId;
      currentStepIndex = stepIdx;
      renderScenarioTabs();
      renderRightPane();
    }

    function selectStep(stepIdx) {
      currentStepIndex = stepIdx;
      renderRightPane();
    }

    function locateInLeftPane(layerId, nodeId) {
      currentLayerId = layerId;
      expandedNodes.add(nodeId);
      highlightedNodeId = nodeId;
      searchQuery = '';
      document.getElementById('globalSearch').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderLayerTabs();
      renderLeftPane();
      setTimeout(() => {
        const el = document.getElementById(`node-${nodeId}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 60);
    }

    function quickJump(layerId, scenarioId) {
      currentLayerId = layerId;
      currentScenarioId = scenarioId;
      currentStepIndex = 0;
      renderLayerTabs();
      renderLeftPane();
      renderScenarioTabs();
      renderRightPane();
    }

    // 搜索过滤绑定
    document.getElementById('globalSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderLeftPane();
    });

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      searchQuery = '';
      document.getElementById('globalSearch').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderLeftPane();
    });

    // 初始渲染
    renderLayerTabs();
    renderLeftPane();
    renderScenarioTabs();
    renderRightPane();
  </script>
</body>
</html>
